name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Testes
        run: npm test
      - name: Sintaxe e dados pessoais/segredos
        run: npm run check
      - name: Scripts de shell
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: Servidor sobe em modo demo
        run: |
          PORT=3999 node server.js --demo & PID=$!
          for i in $(seq 1 20); do curl -fs localhost:3999/api/health && break; sleep 0.5; done
          curl -fs localhost:3999/api/health | grep -q '"ok":true'
          kill $PID
