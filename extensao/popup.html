<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SetupSniper</title>
  <style>
    :root { color-scheme: light dark; --bg: #f3ecdf; --fg: #1b1b1b; --muted: #555; --acc: #ff6b1a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #f3ecdf; --muted: #aaa; } }
    body { margin: 0; padding: 14px; width: min(340px, 100vw); box-sizing: border-box; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 8px; } label { display: grid; gap: 4px; margin: 10px 0; font-weight: 600; }
    input[type=url], input[type=password] { padding: 8px; border: 2px solid var(--fg); border-radius: 6px; background: transparent; color: inherit; font: inherit; min-width: 0; }
    button { padding: 8px 12px; border: 2px solid var(--fg); border-radius: 6px; background: var(--acc); color: #111; font-weight: 700; cursor: pointer; }
    small, .st { color: var(--muted); } .st { margin-top: 10px; overflow-wrap: anywhere; } .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  </style>
</head>
<body>
  <h1>SetupSniper</h1>
  <small>Envia ao <b>seu</b> servidor os preços das páginas de produto e de busca que você abre nas 8 lojas. Carrinho, pagamento e conta nunca são enviados.</small>
  <label>Endereço do seu SetupSniper<input id="server" type="url" placeholder="http://100.x.x.x:3000" autocomplete="off"></label>
  <label>Senha do site (se tiver)<input id="senha" type="password" autocomplete="off"></label>
  <label class="check"><input id="enabled" type="checkbox" checked> Enviar automaticamente</label>
  <div class="row"><button id="save" type="button">Salvar e testar</button></div>
  <div id="st" class="st"></div>
  <script src="popup.js"></script>
</body>
</html>
